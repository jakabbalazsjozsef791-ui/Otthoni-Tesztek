<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Make Money</title>
</head>
<body>
    <div class="osszes">
        <div class="leftSide">
            <h1>Hello:</h1>
            <p>Your mission is to make as many bucks as possiple. You can start simple by making lemonade for people.</p>

            <!-- This button makes money -->
            <button id="gomb" class="buttonType">Make a lemonade</button>

            <h2>Bucks Counter:</h2>
            <p id="counter">0</p>

            
            <!-- hire a kid to make & sell lemonade -->
            <button id="buyKid" class="buttonType" style="display: none;">Hire a kid to make & sell lemonade (costs 10 bucks and gives 1 buck every ten seconds)</button>


            
            <br>
            <button id="buyGroup" class="buttonType" style="display: none;">Hire groups of children (costs 50 bucks and gives 10 bucks every five seconds)</button>

            <button id="invest" class="buttonType" style="display: none;">Invest in stocks (costs 1000 bucks and gives back 50 bucks every few seconds)</button>
        </div>
        <div class="family" style="display: none;" id="fam">
            <h1>This is your private/familial life.</h1>
            <p>Mother:</p>
            <p id="mother_aff">50</p>
        </div>
    </div>

    <button id="saveGame" class="buttonType">Save Game</button>

    <br>
    <br>

    <p>Load Game from JSON file:</p>
    <input type="file" id="loadFile" accept=".json">
    

    <script src="./script.js"></script>
</body>
</html>
